<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ritmo — привычки</title>
<meta name="description" content="Здоровые привычки, режим дня и дисциплина: отметки, серии, прогресс.">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./shared/css/base.css">
<style>
  :root { --accent: #8b6dff; --accent-ink: #0d0720; --accent-bg: rgba(139,109,255,.14); }
  [data-theme="light"] { --accent: #6d4aff; --accent-ink: #ffffff; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center;
          background: var(--bg); z-index: 200; transition: opacity .25s; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot div { font-size: 30px; font-weight: 700; letter-spacing: -.03em; color: var(--accent); }
</style>
</head>
<body>
<div id="boot"><div>Ritmo</div></div>
<div id="root"></div>
<script type="module">
  import './app.js';
  const boot = document.getElementById('boot');
  boot.classList.add('gone');
  setTimeout(() => boot.remove(), 300);
</script>
<noscript style="display:block;padding:24px;font:16px system-ui;color:#e8ecf2">
  Для работы приложения нужен JavaScript.
</noscript>
</body>
</html>
